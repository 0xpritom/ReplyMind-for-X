<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReplyMind for X</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app-container">
        <div class="header-container">
            <div class="header-left">
                <div class="logo-glow-wrapper">
                    <div class="logo-glow"></div>
                    <svg class="logo-img" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="vibrantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00F0FF" />
                                <stop offset="33%" stop-color="#5773FF" />
                                <stop offset="66%" stop-color="#FF007B" />
                                <stop offset="100%" stop-color="#FFB000" />
                            </linearGradient>
                            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#1E293B" />
                                <stop offset="100%" stop-color="#020617" />
                            </linearGradient>
                        </defs>
                        <!-- Dark rounded base -->
                        <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
                        
                        <!-- Glowing border -->
                        <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#vibrantGrad)" stroke-width="3" opacity="0.7" />
                        
                        <!-- The bold 'R' -->
                        <text x="64" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="82" text-anchor="middle" fill="url(#vibrantGrad)">R</text>
                        
                        <!-- AI Magic Stars -->
                        <path d="M96 40 L98 30 L108 28 L98 26 L96 16 L94 26 L84 28 L94 30 Z" fill="#00F0FF" />
                        <path d="M30 46 L31.5 40 L38 38.5 L31.5 37 L30 30 L28.5 37 L22 38.5 L28.5 40 Z" fill="#FFB000" />
                    </svg>
                </div>
                <div class="title-group">
                    <h1 class="app-title">ReplyMind for X</h1>
                    <p class="app-subtitle">AI-Powered Contextual Replies</p>
                </div>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
                <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="currentColor" class="theme-icon" style="display: none;"><path d="M21.752 15.002A9.718 9.718 0 0118 15c-5.523 0-10-4.477-10-10 0-1.473.316-2.871.884-4.133-5.32 1.34-9.333 6.071-9.333 11.633 0 6.627 5.373 12 12 12 5.562 0 10.293-4.013 11.633-9.333a9.721 9.721 0 01-1.432.835z"/></svg>
                <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="currentColor" class="theme-icon"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18.75a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-1.5a.75.75 0 01.75-.75zM6.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.06-1.061l-1.59-1.59zM4.5 12a.75.75 0 01-.75.75H1.5a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM6.166 6.166a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.06 1.061l1.59 1.59z"/></svg>
            </button>
        </div>
        
        <div class="status-card">
            <div class="status-info">
                <div class="status-indicator" id="status-dot"></div>
                <span id="status-text">Inactive</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle-bot">
                <span class="slider round"></span>
            </label>
        </div>

        <div class="status-card">
            <div class="status-info">
                <span>Influence Score Filter</span>
            </div>
            <div class="number-input-group">
                <input type="number" id="influence-score" min="1" placeholder="Min">
                <label class="switch">
                    <input type="checkbox" id="toggle-kol">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <div class="status-card action-mode-box main-toggle-card">
            <div class="status-info" style="justify-content: center;">
                <span>Action Mode</span>
            </div>
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="both">Both</button>
                <button class="mode-btn" data-mode="like">Like</button>
                <button class="mode-btn" data-mode="reply">Reply</button>
            </div>
        </div>

        <div class="form-group">
            <label for="api-key">Groq API Keys</label>
            <textarea id="api-key" placeholder="gsk_..." rows="1" spellcheck="false"></textarea>
        </div>

        <button id="save-btn" class="btn-primary">Save Settings</button>
        <div id="message"></div>
        
        <div class="footer-text" id="footer-text">&copy; 2026 All rights reserved by Pritom</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
